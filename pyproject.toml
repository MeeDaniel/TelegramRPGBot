[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-rpg-core"
version = "0.1.0"
description = "Backend-agnostic turn-based RPG domain package"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["telegram_rpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
