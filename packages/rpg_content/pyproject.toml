[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rpg-content"
version = "0.1.0"
requires-python = ">=3.10"
description = "Immutable validated RPG content snapshots"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rpg_content = ["resources/*.md", "resources/examples/*.json"]
