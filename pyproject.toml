[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-rpg-core"
version = "0.1.0"
description = "Backend-agnostic turn-based RPG domain package"
requires-python = ">=3.10"
dependencies = ["rpg-content>=0.1,<0.2"]

[project.optional-dependencies]
test = ["pytest>=7", "setuptools>=61", "wheel"]

[tool.setuptools]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
